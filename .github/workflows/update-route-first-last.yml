name: Update route first/last

on:
  schedule:
    # TD GTFS is roughly biweekly; Mondays 22:30 UTC ≈ 06:30 HKT Tuesday
    - cron: "30 22 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build route_first_last.json
        run: python3 scripts/build_route_first_last.py route_first_last.json
      - name: Commit if routes changed
        run: |
          # generated timestamp changes every run; only commit when routes payload changes
          if git diff --quiet -- route_first_last.json; then echo "no change"; exit 0; fi
          if git show HEAD:route_first_last.json > /tmp/old.json 2>/dev/null && python3 -c '
          import json, sys
          sys.exit(0 if json.load(open("/tmp/old.json"))["routes"] == json.load(open("route_first_last.json"))["routes"] else 1)
          '; then
            echo "only metadata changed"; git checkout -- route_first_last.json; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route_first_last.json
          git commit -m "Update route first/last ($(date -u +%Y-%m-%d))"
          git push
